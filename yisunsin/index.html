<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>명량</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="마부 인터랙티브">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="명량">
  <meta property="og:description" content="울돌목의 해전을 배경으로 한 5×4 릴 25 페이라인 슬롯. 프리스핀 · 보너스 게임 · 잭팟.">
  <meta property="og:url" content="https://jacksonhkim.github.io/Mabuinteractive/yisunsin/">
  <meta property="og:image" content="https://jacksonhkim.github.io/Mabuinteractive/yisunsin/assets/ui/og_cover_v3.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="명량 — 울돌목 해전을 배경으로 한 슬롯">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="명량">
  <meta name="twitter:description" content="울돌목의 해전을 배경으로 한 5×4 릴 25 페이라인 슬롯. 프리스핀 · 보너스 게임 · 잭팟.">
  <meta name="twitter:image" content="https://jacksonhkim.github.io/Mabuinteractive/yisunsin/assets/ui/og_cover_v3.jpg">
  <meta name="description" content="울돌목의 해전을 배경으로 한 5×4 릴 25 페이라인 슬롯. 프리스핀 · 보너스 게임 · 잭팟.">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060f18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="명량">
  <link rel="apple-touch-icon" href="assets/ui/app_icon_apple_180.png">
  <link rel="icon" type="image/png" href="assets/ui/app_icon_192.png">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>

  <section id="title">

    <h1 id="title-name">명량</h1>
    <p class="tagline">THE LEGEND NEVER SINKS</p>
    <p class="sub" id="title-sub">불러오는 중…</p>

    <p id="boot-error" class="boot-error" role="alert"></p>

    <p class="credit">Sound effects by ElevenLabs</p>
  </section>

  <main id="stage" class="hidden">

    <header class="topbar jackpot-bar" aria-label="누적 보너스">
      <div class="jb-stage">
        <div class="jb-money">
          <span class="jb-label">JACKPOT</span>
          <strong id="jackpot" class="jb-amount">0</strong>
        </div>
      </div>
    </header>

    <div class="reel-panel">
      <canvas id="reels" aria-label="릴 5×4"></canvas>

      <section id="winbanner" class="winbanner hidden" role="status" aria-live="polite">
        <span id="wb-tier" class="wb-tier">BIG WIN</span>
        <strong id="wb-num" class="wb-num">0</strong>

        <span id="wb-line" class="wb-line hidden">+ LINE WIN <b id="wb-line-num">0</b></span>
        <span id="wb-total" class="wb-total hidden">TOTAL WIN <b id="wb-total-num">0</b></span>
      </section>

      <div id="winpop" class="winpop hidden" aria-hidden="true">+0</div>

      <div id="combo-dim" class="combo-dim" aria-hidden="true" hidden></div>

      <div id="combo" class="combo" aria-hidden="true" hidden>×2</div>

      <section id="fs-total" class="fs-total hidden" role="status" aria-live="polite">
        <span class="fs-total-label">무료 스핀 종료</span>
        <strong id="fs-total-num" class="fs-total-num">0</strong>
        <span class="fs-total-sub">총 획득</span>
      </section>
        </div>

    <aside class="side-left">
      <div class="tc-panel" id="tactic">
        <picture>
          <source media="(orientation: landscape) and (max-height: 560px)"
                  srcset="assets/ui/mobile/ui_mobile_tactic_1_seabattle.webp">
          <img class="tc-frame tc-on" data-screen="seabattle" src="assets/ui/ui_tactic_1_seabattle.webp"
          alt="해전 보너스 — 함대 3개가 뜨면 거북선으로 왜군을 격침하는 미니게임이 열립니다"
          width="780" height="1465">
        </picture>
        <picture>
          <source media="(orientation: landscape) and (max-height: 560px)"
                  srcset="assets/ui/mobile/ui_mobile_tactic_2_jackpot.webp">
          <img class="tc-frame" data-screen="jackpot" src="assets/ui/ui_tactic_2_jackpot.webp"
          alt="잭팟 — 거북선 4연속이면 누적 상금 전액을 획득합니다"
          width="780" height="1465">
        </picture>
        <picture>
          <source media="(orientation: landscape) and (max-height: 560px)"
                  srcset="assets/ui/mobile/ui_mobile_tactic_3_freespin.webp">
          <img class="tc-frame" data-screen="freespin" src="assets/ui/ui_tactic_3_freespin.webp"
          alt="프리스핀 — 난중일기 3개가 뜨면 셋 중 골라 무료 스핀을 받습니다"
          width="780" height="1465">
        </picture>
        <picture>
          <source media="(orientation: landscape) and (max-height: 560px)"
                  srcset="assets/ui/mobile/ui_mobile_tactic_4_legendary.webp">
          <img class="tc-frame" data-screen="legendary" src="assets/ui/ui_tactic_4_legendary.webp"
          alt="보너스 게임 — 보물상자 3개가 뜨면 무료 10회 동안 와일드가 누적됩니다"
          width="780" height="1465">
        </picture>
        <ol class="tc-dots" aria-hidden="true"><li></li><li></li><li></li><li></li></ol>
      </div>
    </aside>

    <aside class="side-right" aria-live="polite">

      <div id="fs-status" class="fs-panel idle" aria-label="프리스핀 진행">

        <picture>
          <source media="(orientation: landscape) and (max-height: 560px)"
                  srcset="assets/ui/mobile/ui_mobile_diary.webp">
          <img class="fp-paper" src="assets/ui/ui_side_content_diary.webp" alt="" width="702" height="1339">
        </picture>
        <picture>
          <source media="(orientation: landscape) and (max-height: 560px)"
                  srcset="assets/ui/mobile/ui_mobile_side_frame.webp">
          <img class="fp-frame" src="assets/ui/ui_side_frame_slim_v2.webp" alt="" width="780" height="1449">
        </picture>
        <strong id="fs-left" class="fp-num">—</strong>
        <span id="fs-mult" class="fp-mult">대기</span>
      </div>
    </aside>

    <footer class="controls">
      <div class="side left">

        <div class="sys cell cell-a">
          <button id="info" type="button" class="icon-btn" aria-label="게임 안내">
            <span class="ico">i</span><span class="cap">INFO</span>
          </button>
          <button id="settings" type="button" class="icon-btn" aria-label="설정">
            <span class="ico">⚙</span>
          </button>
        </div>
        <div class="field cell cell-b">
          <span class="label">BET</span>
          <div class="bet-group">
            <button id="bet-down" type="button" aria-label="베팅 감소">−</button>
            <strong id="bet" class="num">0</strong>
            <button id="bet-up" type="button" aria-label="베팅 증가">+</button>
          </div>
        </div>
      </div>

      <button id="spin" type="button" class="primary">SPIN</button>

      <div class="side right">

        <div class="values">
          <div class="field cell cell-c">
            <span class="label">WIN</span>
            <strong id="win" class="num">0</strong>
          </div>

          <div class="field cell cell-d">
            <span class="label">BALANCE</span>
            <strong id="credit" class="num">0</strong>
          </div>
        </div>
        <div class="toggles cell cell-e">
          <button id="fast" type="button" class="toggle" aria-pressed="false">FAST</button>
          <button id="auto" type="button" class="toggle" aria-pressed="false">AUTO</button>
        </div>
      </div>

      <p id="hint" class="hint" role="status" aria-live="polite"></p>
    </footer>

    <section id="choice" class="choice hidden" role="dialog" aria-label="프리스핀 선택">
      <h2>프리스핀</h2>
      <p class="choice-sub">셋 중 하나를 고르십시오</p>
      <div id="choice-list" class="choice-list"></div>
    </section>

    <section id="bonus-intro" class="bonus-intro hidden" role="status" aria-live="polite">
      <img class="bi-chest" src="assets/scenes/x3_bonus_chest.webp" alt="" width="1280" height="1280">
      <strong class="bi-title">BONUS GAME</strong>
      <span class="bi-sub">무료 10회 · 와일드 누적</span>
    </section>

  </main>

  <section id="seabattle" class="seabattle hidden" aria-label="해전 미니게임">
    <canvas id="battle" aria-label="해전 전장"></canvas>
  </section>

  <p id="meta" class="meta"></p>

  <div id="jp-sky" class="jp-sky" aria-hidden="true"></div>

  <img id="jp-ring" src="assets/scenes/x4_jackpot_ring.webp" alt="" aria-hidden="true">
  <div id="jp-sky-hit" class="jp-sky" aria-hidden="true"></div>

  <div id="rotate" class="rotate" role="alertdialog" aria-modal="true"
       aria-labelledby="rotate-title" aria-describedby="rotate-sub">
    <div class="rotate-box">
      <div class="rotate-phone" aria-hidden="true"><span class="rotate-screen"></span></div>
      <p id="rotate-title" class="rotate-title">가로로 돌려 주세요</p>
      <p id="rotate-sub" class="rotate-sub">명량은 가로 화면에 맞춰 만들어졌습니다</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
